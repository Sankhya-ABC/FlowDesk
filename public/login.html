<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowDesk — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="./system/style.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--surface); border:1px solid var(--border);
    border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .login-brand { display:flex; align-items:center; gap:10px; margin-bottom: 24px; }
  .login-brand .brand-logo {
    width:36px; height:36px; border-radius:10px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .login-brand .brand-name { font-weight:800; font-size:18px; }
  .login-form { display:flex; flex-direction:column; gap:16px; }
  .login-error {
    display:none; background:#fee2e2; color:#991b1b; border-radius:8px; padding:10px 12px; font-size:13px;
  }
  .login-hint { font-size:12px; color:var(--text-2); margin-top:4px; }
  .login-submit { width:100%; justify-content:center; }
</style>
</head>
<body>
  <form class="login-card login-form" id="loginForm">
    <div class="login-brand">
      <div class="brand-logo"><i class="fa-solid fa-bolt"></i></div>
      <div class="brand-name">FlowDesk</div>
    </div>

    <div class="login-error" id="loginError"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required autofocus />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" name="senha" required minlength="4" />
      <div class="login-hint">Primeiro acesso? A senha que você digitar agora vira a sua senha.</div>
    </div>

    <button class="btn btn-primary login-submit" type="submit">
      <i class="fa-solid fa-right-to-bracket"></i> Entrar
    </button>
  </form>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const fd = new FormData(form);
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: fd.get('email'), senha: fd.get('senha') }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        errorBox.textContent = data.error || 'Não foi possível entrar.';
        errorBox.style.display = 'block';
        return;
      }

      window.location.href = '/system/index.html';
    } catch {
      errorBox.textContent = 'Sem conexão com o servidor. Tente novamente.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
